name: Build Data Extraction Tool for Windows
on:
  push:
    tags: [data-extraction-v*]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: data-extraction
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: data-extraction/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt pyinstaller
      - name: Run extraction tests
        run: python test_extraction.py
      - name: Run i18n resource tests
        run: python test_i18n.py
      - name: Run bilingual GUI tests
        run: python test_gui_i18n.py
      - name: Compile-check Python sources
        run: python -m py_compile app.py i18n.py i18n_runtime.py
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DataExtractionTool app.py
      - name: Smoke-test GUI startup
        shell: powershell
        run: |
          $p = Start-Process -FilePath "dist\DataExtractionTool.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "GUI exited during startup (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Generate SHA-256 checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash "dist\DataExtractionTool.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  DataExtractionTool.exe" | Set-Content -Encoding ascii "dist\DataExtractionTool.exe.sha256"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataExtractionTool-Windows-${{ github.ref_name }}
          path: |
            data-extraction/dist/DataExtractionTool.exe
            data-extraction/dist/DataExtractionTool.exe.sha256
          if-no-files-found: error
      - name: Publish tagged Release
        if: startsWith(github.ref, 'refs/tags/data-extraction-v')
        uses: softprops/action-gh-release@v2
        with:
          name: 数据提取工具 ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: |
            data-extraction/dist/DataExtractionTool.exe
            data-extraction/dist/DataExtractionTool.exe.sha256
