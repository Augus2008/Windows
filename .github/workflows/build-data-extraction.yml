name: Build Data Extractor for Windows
on:
  push:
    tags: ['data-extraction-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: data-extraction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt pyinstaller
      - name: Test values and percent extraction
        run: python test_extraction.py
      - name: Test bilingual GUI switching
        run: python test_gui_i18n.py
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "DataExtractionTool" app.py
      - name: Smoke-test GUI startup
        shell: powershell
        run: |
          $p = Start-Process -FilePath "dist\DataExtractionTool.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "GUI exited during startup (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataExtractor-Windows
          path: data-extraction/dist/DataExtractionTool.exe
          if-no-files-found: error
      - name: Publish Windows EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          name: 数据提取工具
          prerelease: true
          files: data-extraction/dist/DataExtractionTool.exe
