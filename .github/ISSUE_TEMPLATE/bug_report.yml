name: 缺陷报告 / Bug Report
description: 报告可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "感谢反馈。请勿粘贴密码、Token、私钥、设备序列号或未脱敏日志。"
  - type: input
    id: version
    attributes:
      label: 工具版本 / Tool version
      placeholder: v0.11.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本 / Windows version
      placeholder: Windows 10 / 11
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: 文件格式 / File format
      options: [Excel, CSV, TXT, LOG, TRC, 其他]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 请提供最短可复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual result
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional context
      description: 可附截图或脱敏最小样本。
